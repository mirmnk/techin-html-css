<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>04-CSS :: Uzduotis 3</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      article {
        width: 25rem;

        margin-inline: auto;
        margin-block: 6rem;
        box-shadow: 0 0 1rem 0 #999;
        padding: 1rem;
        padding-top: 0;
        text-align: center;
      }
      article header img {
        border-radius: 45px;
        margin-top: -50px;
      }
      article header p {
        font-style: italic;
        margin-top: 0;
      }
      .material-symbols-outlined {
        color: #bb8417;
      }
    </style>
  </head>
  <body>
    <article>
      <header>
        <img src="i/stocksnap-people-2608581_1280.jpg" alt="" width="90" />
        <p>Name Surname</p>
      </header>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Perferendis vel
        rem harum natus? Nihil, repellendus voluptatibus porro aspernatur hic
        aliquam?
      </p>
      <footer>
        <span class="material-symbols-outlined">star</span>
        <span class="material-symbols-outlined">star</span>
        <span class="material-symbols-outlined">star</span>
        <span class="material-symbols-outlined">star</span>
        <span class="material-symbols-outlined">star</span>
      </footer>
    </article>
  </body>
</html>
