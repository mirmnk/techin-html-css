<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="TECHIN kurso Tinklalapių kūrimas (Edgaras, VH-2) 04-HTML. Užduotis 1 (2026-10-13)"
    />
    <meta
      name="keywords"
      content="HTML, CSS, Tinklalapių kūrimas, TECHIN, 04-HTML"
    />
    <meta name="author" content="Miroslav Monkevič" />
    <title>Užduotis 1 (2026-10-13) :: 04-HTML :: Tinklalapių kūrimas</title>
    <style>
      * {
        font-family: sans-serif;
        font-size: 11px;
      }
      div.form-container {
        width: 20em;
        margin-inline: auto;
        margin-block: 2em;
      }
      div.form-item,
      div.form-item-inline {
        margin-bottom: 1em;
      }
      div.form-item label {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="form-container">
      <form action="#" method="get">
        <div class="form-item-inline">
          <p style="margin-bottom: 0">Tile</p>
          <input type="radio" name="title" id="mr" value="mr" /><label for="mr"
            >Mr</label
          ><input type="radio" name="title" id="mrs" value="mrs" /><label
            for="mrs"
            >Mrs</label
          >
          <input type="radio" name="title" id="miss" value="miss" /><label
            for="miss"
            >Miss</label
          >
        </div>
        <div class="form-item">
          <label for="firstname">First name</label
          ><input type="text" name="firstname" id="firstname" />
        </div>
        <div class="form-item">
          <label for="lastname">Last name</label
          ><input type="text" name="lastname" id="lastname" />
        </div>
        <div class="form-item">
          <label for="email">Email</label
          ><input type="email" name="email" id="email" />
        </div>
        <div class="form-item">
          <label for="phone">Phone number</label
          ><input type="tel" name="phone" id="phone" />
        </div>
        <div class="form-item">
          <label for="password">Password</label
          ><input type="password" name="password" id="password" />
        </div>
        <div class="form-item">
          <label for="country">Country</label>
          <select name="country" id="country">
            <option value="china">China</option>
            <option value="lithuania">Lithuania</option>
          </select>
        </div>
        <div class="form-item-inline">
          <input type="checkbox" name="agreement" id="agreement" />
          <label for="agreement"
            >I agree to the
            <a href="#" target="_blank">terms and conditions</a></label
          >
        </div>
        <div class="form-item">
          <button type="submit">Sing up</button>
          <button type="reset">Reset form</button>
        </div>
      </form>
    </div>
  </body>
</html>
