<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="TECHIN kurso Tinklalapių kūrimas (Edgaras, VH-2) 03-HTML. Užduotis 1 (2026-10-12)"
    />
    <meta
      name="keywords"
      content="HTML, CSS, Tinklalapių kūrimas, TECHIN, 03-HTML"
    />
    <meta name="author" content="Miroslav Monkevič" />
    <title>Užduotis 1 (2026-10-12) :: 02-HTML :: Tinklalapių kūrimas</title>
    <!-- 
    Instructions
Sukurkite HTML puslapį, kuriame būtų trys jūsų mėgstamiausių filmų pavadinimai.
Sukurkite antraštę <h1>, kurioje būtų parašyta "Mano mėgstamiausi filmai"
Sukurkite 3 pastraipas <p> ir kiekvienoje iš jų parašykite po filmo pavadinimą.
Kiekvienai pastraipai nustatykite width: 150px; height: 100px; padding: 10px; margin: 5px;
Pastraipoms suteikite skirtingas fono spalvas naudodami savybę background-color.
Naudodami savybę display pabandykite pastraipoms suteikti inline ir inline-block reikšmes. 
-->
  </head>
  <body>
    <h1>Mano mėgstamiausi filmai</h1>
    <p
      style="
        background-color: red;
        width: 150px;
        height: 100px;
        padding: 10px;
        margin: 5px;
        display: block;
      "
    >
      Graundhog day
    </p>
    <p
      style="
        background-color: yellow;
        width: 150px;
        height: 100px;
        padding: 10px;
        margin: 5px;
        display: inline-block;
      "
    >
      The Ladykillers
    </p>
    <p
      style="
        background-color: aqua;
        display: inline;
        width: 150px;
        height: 100px;
        padding: 10px;
        margin: 5px;
      "
    >
      Nobody
    </p>
  </body>
</html>
